[project]
name = "iodej"
version = "1.0.0"
description = "On mange où ? — swipe des restaurants entre collègues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "tzdata>=2024.1",
    "pywebpush>=2.5.0",
]

[project.scripts]
iodej = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
